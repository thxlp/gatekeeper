# Full stack: gatekeeper (v1) + backend (v2 NestJS, 2 instances load-balanced) + frontend (Next.js) + nginx
# หมายเหตุ: นี่คือ docker-compose.yml ตัวจริงที่ใช้งาน (ไม่มีไฟล์แยกที่ repo root)
services:
  postgres:
    image: postgres:16-alpine
    container_name: gatekeeper-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gatekeeper
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?ต้องตั้งค่าใน .env ก่อน}
      - POSTGRES_DB=gatekeeper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
  gatekeeper:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    container_name: gatekeeper
    restart: unless-stopped
    environment:
      - PORT=8088
      - GATEKEEPER_TICKET_SECRET=${GATEKEEPER_TICKET_SECRET:?ต้องตั้งค่าใน .env ก่อน}
    volumes:
      - gatekeeper-data:/app/data
    expose:
      - "8088"
    mem_limit: 220m
  # จำกัดสิทธิ์ Docker API ให้แคบที่สุดเท่าที่ backend ต้องใช้จริง (containers+images+build เท่านั้น
  # ปิด exec/networks/volumes/swarm) แทนการ mount /var/run/docker.sock ตรงเข้า backend-1/2 ซึ่งเท่ากับ
  # ให้สิทธิ์ root ระดับ host แบบเต็มๆ — backend คุยกับตัวนี้แทนผ่าน tcp (DOCKER_HOST=docker-socket-proxy)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    privileged: true # ต้องใช้จริงสำหรับ image นี้ (มันเข้าถึง docker.sock เอง) — backend เองไม่ privileged
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=1
      - POST=1
      - EXEC=0
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - SYSTEM=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - PLUGINS=0
      - COMMIT=0
      - DISTRIBUTION=0
      - CONFIGS=0
      - SESSION=0
      - EVENTS=1
      - INFO=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    mem_limit: 64m
  backend-1:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: backend-1
    restart: unless-stopped
    environment:
      - PORT=8089
      - NODE_ENV=production
      - COOKIE_CHALLENGE_SECRET=${COOKIE_CHALLENGE_SECRET:?ต้องตั้งค่าใน .env ก่อน}
      - DATABASE_URL=postgres://gatekeeper:${POSTGRES_PASSWORD:?ต้องตั้งค่าใน .env ก่อน}@postgres:5432/gatekeeper
      - FRONTEND_URL=${FRONTEND_URL:?ต้องตั้งค่าใน .env ก่อน}
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?ต้องตั้งค่าใน .env ก่อน}
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?ต้องตั้งค่าใน .env ก่อน}
      - DOCKER_HOST=docker-socket-proxy
      - DOCKER_PORT=2375
      - GATEKEEPER_APPS_NETWORK=gatekeeper-apps-net
      # origin แยกต่างหากสำหรับแอปลูกค้า (/live/<id>) — คนละโดเมนกับ dashboard โดยตั้งใจ กัน
      # JS ของแอปลูกค้าอ่าน localStorage/cookie ของ dashboard ผ่าน same-origin ได้ (ดู
      # buildLiveUrl ใน common/pipeline.util.ts)
      - PUBLIC_LIVE_URL=${PUBLIC_LIVE_URL:-https://live.studiodup.com}
      # master key เข้ารหัส secret ลูกค้า (hex 64 ตัว) — ไม่ตั้งก็ได้ backend จะ generate
      # ไฟล์ data/master.key บน shared volume ให้เอง (แนะนำตั้งใน .env เพื่อแยก key ออกจาก data disk)
      - GATEKEEPER_MASTER_KEY=${GATEKEEPER_MASTER_KEY:-}
    volumes:
      - backend-data:/app/data
    expose:
      - "8089"
    networks:
      - default
      - gatekeeper-apps-net
    depends_on:
      gatekeeper:
        condition: service_started
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    mem_limit: 150m
  backend-2:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    container_name: backend-2
    restart: unless-stopped
    environment:
      - PORT=8089
      - NODE_ENV=production
      - COOKIE_CHALLENGE_SECRET=${COOKIE_CHALLENGE_SECRET:?ต้องตั้งค่าใน .env ก่อน}
      - DATABASE_URL=postgres://gatekeeper:${POSTGRES_PASSWORD:?ต้องตั้งค่าใน .env ก่อน}@postgres:5432/gatekeeper
      - FRONTEND_URL=${FRONTEND_URL:?ต้องตั้งค่าใน .env ก่อน}
      - SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:?ต้องตั้งค่าใน .env ก่อน}
      - SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:?ต้องตั้งค่าใน .env ก่อน}
      - DOCKER_HOST=docker-socket-proxy
      - DOCKER_PORT=2375
      - GATEKEEPER_APPS_NETWORK=gatekeeper-apps-net
      # origin แยกต่างหากสำหรับแอปลูกค้า (/live/<id>) — คนละโดเมนกับ dashboard โดยตั้งใจ กัน
      # JS ของแอปลูกค้าอ่าน localStorage/cookie ของ dashboard ผ่าน same-origin ได้ (ดู
      # buildLiveUrl ใน common/pipeline.util.ts)
      - PUBLIC_LIVE_URL=${PUBLIC_LIVE_URL:-https://live.studiodup.com}
      # master key เข้ารหัส secret ลูกค้า (hex 64 ตัว) — ไม่ตั้งก็ได้ backend จะ generate
      # ไฟล์ data/master.key บน shared volume ให้เอง (แนะนำตั้งใน .env เพื่อแยก key ออกจาก data disk)
      - GATEKEEPER_MASTER_KEY=${GATEKEEPER_MASTER_KEY:-}
    volumes:
      - backend-data:/app/data
    expose:
      - "8089"
    networks:
      - default
      - gatekeeper-apps-net
    depends_on:
      gatekeeper:
        condition: service_started
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    mem_limit: 150m
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile # หรือตามชื่อ Dockerfile ของฝั่ง frontend คุณ
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?ต้องตั้งค่าใน .env ก่อน}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?ต้องตั้งค่าใน .env ก่อน}
    container_name: frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    depends_on:
      - gatekeeper
      - backend-1
      - backend-2
    mem_limit: 220m
  nginx:
    image: nginx:alpine
    container_name: gatekeeper-proxy
    restart: unless-stopped
    depends_on:
      - gatekeeper
      - backend-1
      - backend-2
      - frontend
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../nginx/gatekeeper.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 128m
volumes:
  gatekeeper-data:
  backend-data:
  postgres-data:
networks:
  default:
  # network แยกต่างหากสำหรับ container ของแอปที่ deploy มา (git/manual) — ตั้งใจแยกจาก default
  # ที่ postgres/gatekeeper/frontend/nginx อยู่ เพื่อไม่ให้โค้ดลูกค้าที่หลุด scan ผ่านมา (ถ้ามี)
  # มองเห็น/เชื่อมต่อ service ภายในอื่นๆ ได้โดยตรงผ่าน Docker DNS — backend-1/2 อยู่ทั้งสอง network
  # เพื่อ proxy request เข้า container เหล่านี้ได้ (ดู live/live.controller.ts)
  gatekeeper-apps-net:
    driver: bridge
