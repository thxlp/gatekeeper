# เหลือเฉพาะ infra ที่ยังเป็น container: postgres + docker-socket-proxy
# ตัว gatekeeper เอง (backend ×2 / frontend / nginx) ย้ายไปรันบน host แล้ว — ดู
# deployments/host/README.md + deployments/systemd/ (backend ต่อเข้ามาที่ 127.0.0.1:5432/2375)
# หมายเหตุ: นี่คือ docker-compose.yml ตัวจริงที่ใช้งาน (ไม่มีไฟล์แยกที่ repo root)
services:
  postgres:
    image: postgres:16-alpine
    container_name: gatekeeper-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=gatekeeper
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?ต้องตั้งค่าใน .env ก่อน}
      - POSTGRES_DB=gatekeeper
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # publish เฉพาะ loopback — backend บน host ต่อได้ แต่ tenant container ยิงผ่าน
    # bridge gateway IP ไม่ถึง (สำคัญ: ห้ามเปลี่ยนเป็น "5432:5432" เฉยๆ เด็ดขาด)
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
  # จำกัดสิทธิ์ Docker API ให้แคบที่สุดเท่าที่ backend ต้องใช้จริง (containers+images+build+networks
  # ปิด exec/swarm) แทนการให้ backend แตะ /var/run/docker.sock ตรงๆ ซึ่งเท่ากับสิทธิ์ root ระดับ
  # host แบบเต็มๆ — backend บน host คุยเข้ามาทาง tcp (DOCKER_HOST=127.0.0.1, DOCKER_PORT=2375)
  # NETWORKS=1 จำเป็นตั้งแต่แยก network ต่อ tenant: backend ต้อง create network แบบ dynamic
  # ต่อ account (docker-runtime.service.ts) — tradeoff ที่รับ: โค้ด backend ที่หลุด RCE
  # จะสั่งย้าย network container อื่นได้ด้วย แต่ยังแตะ volume/exec/host ไม่ได้เหมือนเดิม
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    restart: unless-stopped
    privileged: true # ต้องใช้จริงสำหรับ image นี้ (มันเข้าถึง docker.sock เอง) — backend เองไม่ privileged
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - BUILD=1
      - POST=1
      - EXEC=0
      - NETWORKS=1
      # VOLUMES=1 จำเป็นตั้งแต่ทำ cleanup named volume ตอนลบ app (removeAppContainers) —
      # ไม่งั้น volume `gatekeeper-app-*-data` ค้างสะสมจน disk เต็ม tradeoff ที่รับ: โค้ด
      # backend ที่หลุด RCE ลบ volume ได้ (รวม postgres-data ของระบบเอง) แต่ยัง
      # exec เข้า container / แตะ host ตรงๆ ไม่ได้เหมือนเดิม
      - VOLUMES=1
      - SWARM=0
      - SYSTEM=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - PLUGINS=0
      - COMMIT=0
      - DISTRIBUTION=0
      - CONFIGS=0
      - SESSION=0
      - EVENTS=1
      - INFO=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # loopback เท่านั้น เหตุผลเดียวกับ postgres ข้างบน — ตัวนี้ยิ่งสำคัญกว่า (คุม docker ได้)
    ports:
      - "127.0.0.1:2375:2375"
    mem_limit: 64m
volumes:
  postgres-data:
  # volume `backend-data` เดิม (audit.log, master.key) ไม่ได้ mount แล้ว — ข้อมูลย้ายไป
  # backend/data บน host ตอน cutover; ตัว volume ยังอยู่ใน docker จนกว่าจะ `docker volume rm` เอง
networks:
  default:
  # network กลางเดิมของแอปที่ deploy มา — ตอนนี้เหลือบทบาทแค่ fallback สำหรับ app ที่ยังไม่ถูก
  # ย้ายเข้า network ต่อ tenant (gatekeeper-tenant-<accountId> สร้าง dynamic โดย backend ผ่าน
  # NETWORKS=1 ด้านบน — ดู docker-runtime.service.ts) backend บน host มี route ถึงทุก bridge
  # network อยู่แล้ว ไม่ต้องต่อตัวเองเข้า network ไหนอีก
  gatekeeper-apps-net:
    driver: bridge
    # pin ชื่อจริงให้ตรงกับที่โค้ดหา (docker-runtime APPS_NETWORK = 'gatekeeper-apps-net')
    # ไม่งั้น compose จะ prefix ชื่อ project เป็น docker_gatekeeper-apps-net → dockerode หา
    # 'gatekeeper-apps-net' ไม่เจอ → container ของแอปที่ deploy มา start ไม่ขึ้น (network not found)
    name: gatekeeper-apps-net
  # network เฉพาะช่วง build (RUN ใน Dockerfile ของลูกค้า โดยเฉพาะ runtime 'docker') — แยกจาก
  # default bridge ของ daemon เพื่อให้ build-egress-firewall.sh จำกัด egress ได้: ออก registry
  # สาธารณะ (npm/pip) ได้ แต่แตะ internal/metadata ไม่ได้ subnet + ชื่อ ต้องตรงกับ BUILD_NETWORK /
  # BUILD_NETWORK_SUBNET ใน docker-runtime.service.ts และกฎ iptables ในสคริปต์ firewall เป๊ะๆ
  gatekeeper-build-net:
    name: gatekeeper-build-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.238.0/24
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
