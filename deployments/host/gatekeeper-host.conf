# Config สำหรับ nginx บน host (หลังย้าย gatekeeper ออกจาก Docker) — ติดตั้งด้วย symlink:
#   sudo ln -sf /home/dup/gatekeeper/deployments/host/gatekeeper-host.conf /etc/nginx/conf.d/gatekeeper.conf
#   sudo nginx -t && sudo systemctl reload nginx     # nginx -t ต้องผ่านก่อน reload เสมอ
# ต่างจาก deployments/nginx/gatekeeper.conf เวอร์ชัน container เดิมแค่: upstream ชี้ 127.0.0.1
# แทนชื่อ container และไม่มี resolver 127.0.0.11 (อันนั้นคือ DNS ภายในของ Docker)
# สำคัญ: ไฟล์นี้ตั้งใจอยู่นอก deployments/nginx เพราะโฟลเดอร์นั้นถูก mount เข้า nginx container
# ตัวเก่าที่ยังรันอยู่จนถึงวัน cutover — เอาไฟล์นี้ไปวางที่นั่นจะทำ container โหลด config ซ้ำแล้วพัง
# (ลบ deployments/nginx/gatekeeper.conf ทิ้งได้หลัง cutover เสร็จ+verify แล้วเท่านั้น)

# Upstream pool สำหรับ backend — load balance แบบ round-robin ระหว่าง 2 instance (systemd
# template gatekeeper-backend@8089 / gatekeeper-backend@8090, bind 127.0.0.1 เท่านั้น)
upstream backend_pool {
    server 127.0.0.1:8089 max_fails=3 fail_timeout=15s;
    server 127.0.0.1:8090 max_fails=3 fail_timeout=15s;
}

map $http_cookie $has_challenge_cookie {
    default 0;
    "~*gk_challenge=" 1;
}

limit_req_zone $binary_remote_addr zone=gk_req_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gk_conn_limit:10m;

# 1. HTTP — ACME + redirect to HTTPS (คนละ server_name แต่ใช้ webroot/behavior เดียวกัน —
# live.studiodup.com คือ origin แยกสำหรับแอปลูกค้า ดู server block ที่ 3 ด้านล่าง)
server {
    listen 80;
    listen [::]:80;
    server_name gatekeeper.studiodup.com live.studiodup.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS — full stack (UI + API)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gatekeeper.studiodup.com;
    ssl_certificate     /etc/letsencrypt/live/gatekeeper.studiodup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gatekeeper.studiodup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    client_max_body_size 60m;

    # Security headers ทั้ง origin dashboard (ใส่ระดับ server + always เพื่อคลุมทุก location
    # และทุก status — ห้ามใส่ add_header ใน location ใดๆ ของ block นี้เพิ่ม เพราะ nginx จะ
    # เลิก inherit ของระดับ server ทันทีที่ location มี add_header ของตัวเอง)
    # HSTS ไม่ใส่ includeSubDomains — studiodup.com มี subdomain อื่นนอกการดูแล config นี้
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP เป็นชั้นเสริมของ fix XSS ที่ /challenge (safeRedirectPath) — ต่อให้ HTML injection
    # หลุดมาอีก ก็โหลดสคริปต์/ยิงข้อมูลออกไป origin แปลกๆ ไม่ได้
    # ของที่ dashboard ใช้จริงและต้องเปิด: Next.js inline bootstrap ('unsafe-inline' ใน script/style),
    # Supabase auth จาก browser (connect-src *.supabase.co), Google Fonts (globals.css),
    # ภาพพื้นหลัง unsplash (AuthShell.tsx) — เพิ่มโดเมนใหม่ที่นี่ถ้า frontend เริ่มใช้ของนอกเพิ่ม
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Internal cookie check subrequest — ไม่ใส่ limit_req เพื่อไม่ให้ auth subrequest นับซ้ำ
    location /_auth_check {
        internal;
        if ($has_challenge_cookie = 0) {
            return 403;
        }
        return 204;
    }

    # Named location สำหรับ redirect ไป challenge (ใช้โดย error_page 403)
    location @require_challenge {
        return 307 /challenge?redirect=$request_uri;
    }

    location /challenge {
        limit_req zone=gk_req_limit burst=20 nodelay;
        limit_conn gk_conn_limit 20;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GitHub Auto-Deploy webhook — GitHub เข้าไม่ถึง cookie challenge (ไม่มี browser/JS)
    # ต้อง match ก่อน /api/ (nginx เลือก prefix ที่ยาว/เจาะจงกว่าอยู่แล้วไม่ว่าจะเรียงลำดับยังไง)
    # ไม่มี auth_request ที่นี่ — ยืนยันตัวตนด้วย HMAC (X-Hub-Signature-256) ที่ตรวจในตัว backend เอง
    location /api/webhooks/github {
        limit_req zone=gk_req_limit burst=20 nodelay;
        limit_conn gk_conn_limit 20;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /live/<app-id> ย้ายไปอยู่ origin แยกที่ live.studiodup.com แล้ว (server block ที่ 3
    # ด้านล่าง) ตั้งใจไม่เสิร์ฟที่นี่อีกต่อไป — ถ้ายังเปิดทั้งสอง origin พร้อมกัน โค้ดของลูกค้า
    # (ไม่ควรไว้ใจ) จะยังอ่าน localStorage/cookie ของ dashboard ผ่าน same-origin ได้เหมือนเดิม
    # เท่ากับแก้ช่องโหว่ไม่จบ (verified 2026-07-07: live.studiodup.com/live/<id> proxy เข้า
    # live.controller.ts ได้ถูกต้องแล้วก่อนลบตรงนี้)

    # NestJS API — audit + apps + auth (load balanced 2 instances)
    location /api/ {
        limit_req zone=gk_req_limit burst=20 nodelay;
        limit_conn gk_conn_limit 20;
        auth_request /_auth_check;
        error_page 403 = @require_challenge;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js UI
    location / {
        limit_req zone=gk_req_limit burst=20 nodelay;
        limit_conn gk_conn_limit 20;

        # studiodup.com คือโดเมนหลักตอนนี้ (ผ่าน Cloudflare proxy ไปที่ origin เดียวกันนี้ —
        # ตกมาที่ default server block นี้อยู่แล้วเพราะไม่มี server_name ของตัวเองแยกต่างหาก)
        # คนที่เข้ามาทาง gatekeeper.studiodup.com (โดเมนเดิม) ให้เด้งไปหน้าเดียวกันบน
        # studiodup.com ทันที ก่อนเข้า challenge flow — เฉพาะหน้าเว็บ/UI เท่านั้น location อื่น
        # ในไฟล์นี้ (webhook, /api/, /challenge) ไม่แตะ ยังทำงานที่
        # gatekeeper.studiodup.com เหมือนเดิมทุกประการ (ตั้งใจ — GitHub webhook ที่ลงทะเบียน
        # ไว้แล้วชี้มาที่นี่ ส่วนใหญ่ webhook sender ไม่ follow redirect กันพังเวลา deploy)
        if ($host = gatekeeper.studiodup.com) {
            return 301 https://studiodup.com$request_uri;
        }

        auth_request /_auth_check;
        error_page 403 = @require_challenge;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# 3. HTTPS — live.studiodup.com: origin แยกต่างหากสำหรับแอปลูกค้าที่ deploy ผ่านระบบ (/live/<id>)
# ตั้งใจแยกจาก gatekeeper.studiodup.com (dashboard) โดยเด็ดขาด — โค้ดของลูกค้าเป็นโค้ดที่ไม่
# ควรไว้ใจ ถ้าอยู่ origin เดียวกับ dashboard จะอ่าน localStorage/cookie ของ dashboard ผ่าน
# same-origin policy ได้ทันที (ดู backend/src/common/pipeline.util.ts::buildLiveUrl)
# cert ออกสำเร็จแล้ว 2026-07-07 (certbot webroot, หมดอายุ 2026-10-05, ต่ออายุอัตโนมัติ)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name live.studiodup.com;
    ssl_certificate     /etc/letsencrypt/live/live.studiodup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.studiodup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS อย่างเดียว (host-scoped, origin นี้เป็น HTTPS ล้วนอยู่แล้ว) — ตั้งใจ "ไม่" ใส่ CSP /
    # X-Content-Type-Options / X-Frame-Options ที่นี่: เนื้อหาใต้ /live/ เป็นแอปของลูกค้า
    # การบังคับ policy ของเราทับอาจทำแอปเขาพังโดยไม่รู้ตัว (เช่น sniff mime, ถูก embed ใน iframe)
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ไม่มี auth_request/cookie challenge ที่นี่ — แอปลูกค้าที่ deploy สำเร็จต้องให้คนทั่วไป
    # เข้าถึงได้ตรงๆ เหมือนกับ /live/ เดิมบน gatekeeper.studiodup.com (ดู live/live.controller.ts)
    location /live/ {
        limit_req zone=gk_req_limit burst=20 nodelay;
        limit_conn gk_conn_limit 20;
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
